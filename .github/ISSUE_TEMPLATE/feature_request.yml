name: Feature request
description: 提一个功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先描述场景，不要直接跳到实现
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你建议怎么做
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过现有 Issue / Roadmap
          required: true
