[package]
name = "wechat-agent-desktop-rust"
version = "1.3.8"
edition = "2021"
license = "MIT"
description = "Rust/Tauri unified desktop console: local agent + LYPH collector"

[lib]
name = "wechat_agent_desktop"
path = "src/lib.rs"

[[bin]]
name = "WeChatAgentDesktop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
open = "5"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
toml = "0.8"
xcap = "0.9"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
winapi = { version = "0.3", features = ["winerror", "errhandlingapi", "handleapi", "synchapi"] }
windows-dpapi = "0.2"
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
tauri = { version = "=2.12.1", default-features = false, features = ["tray-icon"] }
