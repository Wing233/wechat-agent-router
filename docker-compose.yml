services:
  router:
    image: wechat-agent-router:0.1.0
    container_name: wechat-agent-router
    restart: unless-stopped
    ports:
      - "9900:9900"
    volumes:
      - .:/app
      - ./data:/data
      - ./geodb:/geodb:ro
      - ./sandbox:/sandbox
      - ./workspace:/workspace
      - /opt/lyph:/lyph-src
      - /opt/git/wechat-agent-router.git:/opt/git/wechat-agent-router.git
      - /opt/git/lyph.git:/opt/git/lyph.git
      - /var/lib/docker/volumes/lyph_business/_data:/lyph-data
    networks:
      - default
      - hub
      - lyph
      - executor

  executor:
    image: wechat-agent-router:0.1.0
    container_name: wechat-agent-executor
    restart: unless-stopped
    profiles: ["isolated-executor"]
    command: ["python", "-m", "uvicorn", "executor.server:app", "--host", "0.0.0.0", "--port", "9800", "--no-access-log"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./executor:/app/executor:ro
      - ./workspace:/workspace
    environment:
      PYTHONPATH: /app
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-}
      EXECUTOR_WORKSPACE: /workspace
    working_dir: /workspace
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    networks:
      - executor

networks:
  hub:
    external: true
    name: openilink-hub_default
  lyph:
    external: true
    name: lyph_private
  executor:
    internal: true
