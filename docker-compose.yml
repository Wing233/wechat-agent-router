services:
  router:
    build: .
    image: wechat-agent-router:dev
    container_name: wechat-agent-router
    restart: unless-stopped
    ports:
      - "9900:9900"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.json:/app/config.json
      - ./data:/data
      - ./workspace:/workspace
      - ./plugins:/app/plugins
      - ./sandbox:/sandbox
      - ./geodb:/geodb:ro
      # lyph 公开数据来源：lyph_tools 直读 lyph 主库与企业公开快照。
      # 默认值取自部署机（/opt/lyph 源码目录 + lyph_business 卷）；脱离 lyph 单独
      # 运行时用 LYPH_SRC_PATH / LYPH_DATA_PATH 指到别处，或挂空目录让相关工具
      # 返回 unavailable。
      - ${LYPH_SRC_PATH:-/opt/lyph}:/lyph-src
      - ${LYPH_DATA_PATH:-/var/lib/docker/volumes/lyph_business/_data}:/lyph-data
    networks:
      - default
      - hub
      # Router -> lyph 回调（/api/v1/internal/router/task）按 lyph-api-1 解析。
      # 没有 lyph 部署时删掉这一行与下面的 lyph 网络定义即可单独起服务。
      - lyph
      - executor

  executor:
    image: wechat-agent-router:0.1.0
    container_name: wechat-agent-executor
    restart: unless-stopped
    profiles: ["isolated-executor"]
    command: ["python", "-m", "uvicorn", "executor.server:app", "--host", "0.0.0.0", "--port", "9800", "--no-access-log"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./executor:/app/executor:ro
      - ./workspace:/workspace
    environment:
      PYTHONPATH: /app
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-}
      EXECUTOR_WORKSPACE: /workspace
    working_dir: /workspace
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    networks:
      - executor

networks:
  hub:
    external: true
    name: openilink-hub_default
  lyph:
    external: true
    name: lyph_private
  executor:
    internal: true
