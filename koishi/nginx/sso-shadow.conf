# Stage 1 (shadow): only the SSO IdP endpoints and the lyph session probe.
# /koishi/ and /admin stay on their existing gates until the full sso.conf is
# deployed. Replace __GATE_TOKEN__ with config.json -> koishi_auth.gate_token.

location = /_sso {
    internal;
    proxy_pass http://wechat-agent-router:9900/sso/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Koishi-Auth-Gate "__GATE_TOKEN__";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
}

location = /sso/setup {
    auth_basic "Koishi Console";
    auth_basic_user_file /etc/nginx/apps/koishi.htpasswd;
    proxy_pass http://wechat-agent-router:9900;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Koishi-Auth-Gate "__GATE_TOKEN__";
    proxy_read_timeout 60s;
}

location = /sso {
    return 302 /sso/login;
}

location ^~ /sso/ {
    proxy_pass http://wechat-agent-router:9900;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Koishi-Auth-Gate "__GATE_TOKEN__";
    proxy_read_timeout 60s;
}

location = /api/v1/auth/session {
    auth_request /_sso;
    auth_request_set $sso_verified $upstream_http_x_sso_verified;
    error_page 401 = @lyph_auth_session;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SSO-Verified $sso_verified;
    proxy_buffering off;
    proxy_cache off;
}

location @lyph_auth_session {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SSO-Verified "";
}
