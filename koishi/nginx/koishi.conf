# Legacy Koishi Authenticator endpoints (fallback path).
#
# The /koishi/ console is gated by /etc/nginx/apps/sso.conf. This file keeps
# the old Basic Auth + TOTP endpoints reachable so an operator can roll back by
# restoring the previous /koishi/ block from git and removing sso.conf.
location ^~ /koishi-auth/ {
    auth_basic "Koishi Console";
    auth_basic_user_file /etc/nginx/apps/koishi.htpasswd;
    proxy_pass http://wechat-agent-router:9900;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Koishi-Auth-Gate "__GATE_TOKEN__";
    proxy_read_timeout 60s;
}
