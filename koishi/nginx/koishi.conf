# Koishi console: HTTPS + Basic Auth + Authenticator (TOTP).
# Replace __GATE_TOKEN__ with config.json -> koishi_auth.gate_token.
location = /koishi {
    auth_basic "Koishi Console";
    auth_basic_user_file /etc/nginx/apps/koishi.htpasswd;
    return 301 /koishi/;
}

location = /_koishi_totp {
    internal;
    proxy_pass http://wechat-agent-router:9900/koishi-auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Koishi-Auth-Gate "__GATE_TOKEN__";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /koishi-auth/ {
    auth_basic "Koishi Console";
    auth_basic_user_file /etc/nginx/apps/koishi.htpasswd;
    proxy_pass http://wechat-agent-router:9900;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Koishi-Auth-Gate "__GATE_TOKEN__";
    proxy_read_timeout 60s;
}

location ^~ /koishi/ {
    auth_basic "Koishi Console";
    auth_basic_user_file /etc/nginx/apps/koishi.htpasswd;
    auth_request /_koishi_totp;
    error_page 403 = @koishi_totp_login;

    proxy_pass http://172.19.0.1:5140;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
}

location @koishi_totp_login {
    return 302 https://$host/koishi-auth/login?next=$request_uri;
}
