# Unified Authenticator (TOTP) SSO gate for the Koishi console and lyph admin.
#
# Copy this file to /etc/nginx/apps/sso.conf next to koishi.conf. Replace
# __GATE_TOKEN__ with config.json -> koishi_auth.gate_token (same value as the
# legacy /koishi-auth/ gate). The router must be reachable as
# wechat-agent-router:9900 on the lyph private network. The http block needs
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# for the Koishi WebSocket (lyph deploy/nginx.conf and nginx-tls.conf carry it).
#
# Generic pattern: copy the auth_request pair below into any location you want
# to protect. Page locations redirect to /sso/login; JSON APIs answer 401.
#
#   auth_request /_sso;
#   auth_request_set $sso_verified $upstream_http_x_sso_verified;
#
# Do NOT add Basic Auth to /sso/*: the login page must stay reachable from the
# lyph admin login flow.

# --- auth_request target ---------------------------------------------------
location = /_sso {
    internal;
    proxy_pass http://wechat-agent-router:9900/sso/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Koishi-Auth-Gate "__GATE_TOKEN__";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
}

# --- enrollment is break-glass: keep htpasswd on this one exact location ----
# The secret must never be shown to an unauthenticated visitor after a reset.
location = /sso/setup {
    auth_basic "Koishi Console";
    auth_basic_user_file /etc/nginx/apps/koishi.htpasswd;
    proxy_pass http://wechat-agent-router:9900;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Koishi-Auth-Gate "__GATE_TOKEN__";
    proxy_read_timeout 60s;
}

location = /sso {
    return 302 /sso/login;
}

# The login page, logout page and POST handlers live on the router.
location ^~ /sso/ {
    proxy_pass http://wechat-agent-router:9900;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Koishi-Auth-Gate "__GATE_TOKEN__";
    proxy_read_timeout 60s;
}

# --- example 1: Koishi console (STAGE 3: cut over last) --------------------
location = /koishi {
    return 301 /koishi/;
}

location ^~ /koishi/ {
    auth_request /_sso;
    error_page 401 = @sso_login;

    # Replace with the Koishi console address used by the current deployment.
    proxy_pass http://172.19.0.1:5140;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
}

# --- example 2: lyph admin pages (STAGE 2) --------------------------------
location = /admin {
    auth_request /_sso;
    error_page 401 = @sso_login;
    proxy_pass http://web_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
}

location ^~ /admin/ {
    auth_request /_sso;
    error_page 401 = @sso_login;
    proxy_pass http://web_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}

# --- example 3: lyph admin API (STAGE 2) ----------------------------------
# ^~ wins over the generic "location /api/" prefix, so only /api/v1/admin is
# gated. Public chat / content APIs keep their existing proxy unchanged.
location = /api/v1/admin {
    auth_request /_sso;
    auth_request_set $sso_verified $upstream_http_x_sso_verified;
    error_page 401 = @sso_api_unauthorized;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SSO-Verified $sso_verified;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
}

location ^~ /api/v1/admin/ {
    auth_request /_sso;
    auth_request_set $sso_verified $upstream_http_x_sso_verified;
    error_page 401 = @sso_api_unauthorized;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SSO-Verified $sso_verified;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
}

# --- lyph session/logout: optional gate, header only when authenticated ---
# STAGE 1 (shadow) uses this block; it never blocks the request.
# /auth/session must answer 200 {"authenticated": false} when logged out, so a
# failed auth_request falls through to a copy without the SSO header.
location = /api/v1/auth/session {
    auth_request /_sso;
    auth_request_set $sso_verified $upstream_http_x_sso_verified;
    error_page 401 = @lyph_auth_session;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SSO-Verified $sso_verified;
    proxy_buffering off;
    proxy_cache off;
}

# --- lyph logout: optional gate so a live session can validate CSRF --------
location = /api/v1/auth/logout {
    auth_request /_sso;
    auth_request_set $sso_verified $upstream_http_x_sso_verified;
    error_page 401 = @lyph_auth_logout;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SSO-Verified $sso_verified;
    proxy_buffering off;
    proxy_cache off;
}

# --- failure handlers ------------------------------------------------------
location @sso_login {
    # $uri (not $request_uri) keeps the value a single query parameter; deep
    # links lose their query string, which is acceptable for a login redirect.
    return 302 /sso/login?next=$uri;
}

location @sso_api_unauthorized {
    default_type application/json;
    return 401 '{"detail":"Owner authentication required"}';
}

location @lyph_auth_session {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SSO-Verified "";
}

location @lyph_auth_logout {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SSO-Verified "";
}
